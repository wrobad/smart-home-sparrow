<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1621">
<title>System Sparrow</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/mqtt@5/dist/mqtt.min.js"></script>
<style>
:root{--bg:#0E1621;--card:#172231;--chip:#223044;--muted:#93A1B3;--text:#E8EDF3;--accent:#F5A524;--nav:#111B28}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Manrope,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
main{padding:calc(20px + env(safe-area-inset-top)) 20px 120px;display:flex;flex-direction:column;gap:14px;max-width:560px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;min-height:40px}
.brand{margin:0;font-size:15px;font-weight:700;letter-spacing:.12em;color:#C5CFDB}
.status{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;font-size:13px;font-weight:600;background:#2A2414;color:#FCD34D}
.status i{width:8px;height:8px;border-radius:50%;background:currentColor}
.status.ok{background:#13261F;color:#6EE7A8}
.status.err{background:#2B1618;color:#FCA5A5}
.card{background:var(--card);border-radius:24px}
.clock{padding:20px 22px;display:flex;justify-content:space-between;align-items:center}
.time{font-size:56px;font-weight:800;color:var(--accent);letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.date{text-align:right;display:flex;flex-direction:column;gap:4px}
.date b{font-size:15px}
.date span{font-size:13px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{padding:18px;display:flex;flex-direction:column;gap:10px}
.tile .lbl{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.tile .big{font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1}
.tile .sub{font-size:12px;color:var(--muted);line-height:1.4;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.sechead{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px}
.sechead h2{margin:0;font-size:17px;font-weight:700}
.sechead span{font-size:13px;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:10px}
.room{padding:12px 14px;display:flex;align-items:center;gap:14px;border-radius:20px}
.ico{width:44px;height:44px;border-radius:14px;background:var(--chip);color:var(--muted);display:flex;align-items:center;justify-content:center;flex:none;transition:.2s}
.room.on .ico{background:var(--accent);color:#1A1206}
.room .name{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.room .name b{font-size:15px}
.room .name span{font-size:12px;color:var(--muted)}
.room.on .name span{color:var(--accent);font-weight:600}
.switch{width:52px;height:32px;border:none;border-radius:999px;background:#2B3A50;padding:3px;display:flex;cursor:pointer;flex:none;transition:.2s}
.switch i{width:26px;height:26px;border-radius:50%;background:var(--muted);transition:transform .2s,background .2s}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"] i{transform:translateX(20px);background:var(--bg)}
.switch:disabled,.bigbtn:disabled{opacity:.4;cursor:default}
nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;padding:10px 12px calc(14px + env(safe-area-inset-bottom));background:var(--nav);border-top:1px solid #1E2A3B}
nav button{border:none;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;cursor:pointer;font:600 12px Manrope,system-ui,sans-serif}
nav button span{width:56px;height:32px;border-radius:999px;display:flex;align-items:center;justify-content:center;transition:.2s}
nav button[aria-current="page"]{color:var(--accent);font-weight:700}
nav button[aria-current="page"] span{background:#2A2414}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
[hidden]{display:none!important}
.roomview{display:flex;flex-direction:column;align-items:center;gap:22px;padding:36px 20px}
.bigbtn{width:180px;height:180px;border-radius:50%;border:none;background:var(--chip);color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.25s}
.bigbtn svg{width:72px;height:72px;stroke-width:1.5}
.bigbtn.on{background:var(--accent);color:#1A1206;box-shadow:0 0 0 12px rgba(245,165,36,.15)}
.roomview h2{margin:0;font-size:26px;font-weight:800}
.roomview p{margin:0;color:var(--muted);font-size:14px;text-align:center}
.pill{font-size:12px;font-weight:600;padding:6px 10px;border-radius:999px;background:var(--chip);color:var(--muted)}
.pill.ok{background:#13261F;color:#6EE7A8}
.pill.err{background:#2B1618;color:#FCA5A5}
</style>
</head>
<body>
<main>
  <header>
    <h1 class="brand">SYSTEM SPARROW</h1>
    <div class="status" id="status" role="status"><i></i><span>Łączenie…</span></div>
  </header>

  <!-- EKRAN GŁÓWNY -->
  <div id="home" class="view" style="display:flex;flex-direction:column;gap:14px">
    <section class="card clock">
      <div class="time" id="time">--:--</div>
      <div class="date"><b id="weekday"></b><span id="date"></span></div>
    </section>

    <div class="grid2">
      <section class="card tile">
        <div class="lbl" style="color:#7DD3FC"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 18a4.5 4.5 0 1 1 .9-8.9A6 6 0 0 1 19 11a3.5 3.5 0 0 1-.5 7z"/></svg>Na zewnątrz</div>
        <div class="big" id="outTemp">–</div>
        <div class="sub"><span id="weatherDesc">Pobieranie pogody…</span><span id="wind"></span></div>
      </section>
      <section class="card tile">
        <div class="lbl" style="color:var(--accent)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 14.8V5a2 2 0 0 0-4 0v9.8a4 4 0 1 0 4 0z"/></svg>Wewnątrz</div>
        <div class="big" id="inTemp">–</div>
        <div class="sub"><svg viewBox="0 0 24 24" style="width:16px;height:16px" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg><span id="moon"></span></div>
      </section>
    </div>

    <div class="sechead"><h2>Oświetlenie</h2><span id="countOn"></span></div>
    <div class="list" id="roomList"></div>
  </div>

  <!-- EKRAN POMIESZCZENIA -->
  <section id="roomView" class="card roomview" hidden>
    <span class="pill" id="rvDevice">Brak danych z urządzenia</span>
    <button class="bigbtn" id="rvBtn" aria-label="Przełącz światło">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg>
    </button>
    <h2 id="rvName"></h2>
    <p id="rvState"></p>
  </section>
</main>

<nav id="nav" aria-label="Pomieszczenia"></nav>

<script>
// ===========================================================================
// KONFIGURACJA – zmieniaj tylko tutaj
// ===========================================================================
const CONFIG = {
  // Broker MQTT po WebSocket (strona przez https wymaga wss://)
  broker:   'wss://broker.hivemq.com:8884/mqtt',
  username: '',          // puste = bez logowania
  password: '',

  // Temat, na który ESP wysyła temperaturę wewnątrz (np. "22.5")
  tempTopic: 'dom_adam_2026/pokoj1/temperatura',

  // Lokalizacja do pogody (Open-Meteo, bez klucza API)
  location: { name: 'Polska', lat: 52.23, lon: 21.01 },

  // Pomieszczenia: tematy = base + "/set", "/state", "/online"
  rooms: [
    { id: 'pokoj',    name: 'Pokój',    base: 'dom_adam_2026/pokoj1/swiatlo',   icon: 'sofa' },
    { id: 'kuchnia',  name: 'Kuchnia',  base: 'dom_adam_2026/kuchnia/swiatlo',  icon: 'pot'  },
    { id: 'lazienka', name: 'Łazienka', base: 'dom_adam_2026/lazienka/swiatlo', icon: 'bath' }
  ]
};
// ===========================================================================

const ICONS = {
  home: '<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>',
  sofa: '<path d="M4 11V8a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v3"/><path d="M2 13a2 2 0 0 1 4 0v2h12v-2a2 2 0 0 1 4 0v5H2z"/><path d="M5 18v2M19 18v2"/>',
  pot:  '<path d="M4 10h16v7a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3z"/><path d="M2 10h20"/><path d="M9 6c0-1 1-1 1-2M14 6c0-1 1-1 1-2"/>',
  bath: '<path d="M3 12h18v3a5 5 0 0 1-5 5H8a5 5 0 0 1-5-5z"/><path d="M6 12V5a2 2 0 0 1 3.5-1.3"/><path d="M7 20l-1 2M17 20l1 2"/>',
  bulb: '<path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/>'
};
const svg = name => `<svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[name]}</svg>`;
const $ = id => document.getElementById(id);

// Stan pomieszczeń: light = true/false/null (nieznany), online = true/false/null
const rooms = CONFIG.rooms.map(r => ({ ...r, light: null, online: null }));
let client = null, connected = false, currentView = 'home';

// ---------------------------------------------------------------- UI: lista
function buildRoomList() {
  $('roomList').innerHTML = rooms.map(r => `
    <div class="card room" id="row-${r.id}">
      <div class="ico">${svg('bulb')}</div>
      <div class="name"><b>${r.name}</b><span id="txt-${r.id}">Brak danych</span></div>
      <button class="switch" role="switch" aria-checked="false" aria-label="Światło: ${r.name}" id="sw-${r.id}"><i></i></button>
    </div>`).join('');
  rooms.forEach(r => $('sw-' + r.id).addEventListener('click', () => toggle(r)));
}

function buildNav() {
  const items = [{ id: 'home', name: 'Home', icon: 'home' }, ...rooms];
  $('nav').innerHTML = items.map(it => `
    <button data-view="${it.id}"><span>${svg(it.icon)}</span>${it.name}</button>`).join('');
  $('nav').querySelectorAll('button').forEach(b =>
    b.addEventListener('click', () => showView(b.dataset.view)));
}

function showView(id) {
  currentView = id;
  $('nav').querySelectorAll('button').forEach(b => {
    if (b.dataset.view === id) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
  });
  $('home').hidden = id !== 'home';
  $('roomView').hidden = id === 'home';
  render();
  window.scrollTo(0, 0);
}

function stateText(r) {
  if (r.online === false) return 'Urządzenie offline';
  if (r.light === null) return 'Brak danych';
  return r.light ? 'Włączone' : 'Wyłączone';
}

function render() {
  let on = 0;
  rooms.forEach(r => {
    if (r.light) on++;
    const canUse = connected && r.online !== false;
    $('row-' + r.id).classList.toggle('on', !!r.light);
    $('txt-' + r.id).textContent = stateText(r);
    const sw = $('sw-' + r.id);
    sw.setAttribute('aria-checked', r.light ? 'true' : 'false');
    sw.disabled = !canUse;
  });
  $('countOn').textContent = `${on} z ${rooms.length} włączone`;

  const r = rooms.find(x => x.id === currentView);
  if (r) {
    $('rvName').textContent = r.name;
    $('rvState').textContent = 'Światło: ' + stateText(r).toLowerCase();
    $('rvBtn').classList.toggle('on', !!r.light);
    $('rvBtn').disabled = !(connected && r.online !== false);
    const dev = $('rvDevice');
    dev.className = 'pill' + (r.online === true ? ' ok' : r.online === false ? ' err' : '');
    dev.textContent = r.online === true ? 'Urządzenie online' : r.online === false ? 'Urządzenie offline' : 'Brak danych z urządzenia';
  }
}

$('rvBtn').addEventListener('click', () => {
  const r = rooms.find(x => x.id === currentView);
  if (r) toggle(r);
});

function setStatus(kind, text) {
  $('status').className = 'status' + (kind ? ' ' + kind : '');
  $('status').querySelector('span').textContent = text;
}

// ---------------------------------------------------------------- MQTT
function toggle(r) {
  if (!connected) return;
  const next = !r.light;
  client.publish(r.base + '/set', next ? 'ON' : 'OFF');
  if (navigator.vibrate) navigator.vibrate(15);
  // Stan zmieni się, gdy ESP potwierdzi go w temacie /state
}

function connectMqtt() {
  if (typeof mqtt === 'undefined') { setStatus('err', 'Brak biblioteki MQTT'); return; }
  client = mqtt.connect(CONFIG.broker, {
    clientId: 'sparrow-app-' + Math.random().toString(16).slice(2, 10),
    username: CONFIG.username || undefined,
    password: CONFIG.password || undefined,
    keepalive: 30,
    reconnectPeriod: 3000,
    connectTimeout: 10000,
    clean: true
  });

  client.on('connect', () => {
    connected = true;
    setStatus('ok', 'Połączono');
    const topics = [CONFIG.tempTopic];
    rooms.forEach(r => topics.push(r.base + '/state', r.base + '/online'));
    client.subscribe(topics);
    render();
  });
  client.on('reconnect', () => setStatus('', 'Łączenie…'));
  client.on('offline',   () => { connected = false; setStatus('err', 'Rozłączono'); render(); });
  client.on('close',     () => { connected = false; render(); });
  client.on('error',     e  => { console.warn('MQTT:', e && e.message); setStatus('err', 'Błąd połączenia'); });

  client.on('message', (topic, payload) => {
    const msg = payload.toString().trim();
    if (topic === CONFIG.tempTopic) {
      const t = parseFloat(msg.replace(',', '.'));
      if (!isNaN(t)) $('inTemp').textContent = t.toFixed(1) + '°';
      return;
    }
    for (const r of rooms) {
      if (topic === r.base + '/state')  r.light  = msg.toUpperCase() === 'ON';
      if (topic === r.base + '/online') r.online = msg.toLowerCase() === 'online';
    }
    render();
  });
}

// ---------------------------------------------------------------- Zegar
function tick() {
  const d = new Date();
  $('time').textContent = d.toLocaleTimeString('pl-PL', { hour: '2-digit', minute: '2-digit' });
  const wd = d.toLocaleDateString('pl-PL', { weekday: 'long' });
  $('weekday').textContent = wd.charAt(0).toUpperCase() + wd.slice(1);
  $('date').textContent = d.toLocaleDateString('pl-PL', { day: 'numeric', month: 'long', year: 'numeric' });
}

// ---------------------------------------------------------------- Księżyc
function moonInfo(date = new Date()) {
  const SYN = 29.530588853;
  const ref = Date.UTC(2000, 0, 6, 18, 14);           // znany nów
  const age = (((date - ref) / 86400000) % SYN + SYN) % SYN;
  const illum = Math.round((1 - Math.cos(2 * Math.PI * age / SYN)) / 2 * 100);
  const names = ['Nów', 'Przybywający sierp', 'Pierwsza kwadra', 'Przybywający garb',
                 'Pełnia', 'Ubywający garb', 'Ostatnia kwadra', 'Ubywający sierp'];
  const idx = Math.floor(((age / SYN) * 8) + 0.5) % 8;
  return `${names[idx]} · ${illum}%`;
}

// ---------------------------------------------------------------- Pogoda
const WMO = {
  0: 'Bezchmurnie', 1: 'Przeważnie bezchmurnie', 2: 'Częściowe zachmurzenie', 3: 'Pochmurno',
  45: 'Mgła', 48: 'Mgła szronowa', 51: 'Lekka mżawka', 53: 'Mżawka', 55: 'Gęsta mżawka',
  56: 'Marznąca mżawka', 57: 'Marznąca mżawka', 61: 'Lekki deszcz', 63: 'Deszcz', 65: 'Ulewa',
  66: 'Marznący deszcz', 67: 'Marznący deszcz', 71: 'Lekki śnieg', 73: 'Śnieg', 75: 'Intensywny śnieg',
  77: 'Ziarna śniegu', 80: 'Przelotny deszcz', 81: 'Przelotny deszcz', 82: 'Silne opady',
  85: 'Przelotny śnieg', 86: 'Przelotny śnieg', 95: 'Burza', 96: 'Burza z gradem', 99: 'Burza z gradem'
};

async function loadWeather() {
  const { lat, lon } = CONFIG.location;
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}` +
              `&current=temperature_2m,weather_code,wind_speed_10m&wind_speed_unit=kmh&timezone=auto`;
  try {
    const res = await fetch(url);
    const c = (await res.json()).current;
    $('outTemp').textContent = Math.round(c.temperature_2m) + '°';
    $('weatherDesc').textContent = WMO[c.weather_code] || 'Pogoda';
    $('wind').textContent = '· Wiatr ' + Math.round(c.wind_speed_10m) + ' km/h';
  } catch (e) {
    $('weatherDesc').textContent = 'Brak danych pogodowych';
  }
}

// ---------------------------------------------------------------- Start
buildRoomList();
buildNav();
showView('home');
tick(); setInterval(tick, 1000);
$('moon').textContent = moonInfo();
setInterval(() => $('moon').textContent = moonInfo(), 3600000);
loadWeather(); setInterval(loadWeather, 15 * 60 * 1000);
connectMqtt();

if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
